<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qaisypro</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:20px}
.box{background:#111;padding:15px;border-radius:12px;border:1px solid #222;max-width:500px;margin:15px auto}
button{background:#D4AF37;color:#000;border:0;padding:10px 18px;border-radius:8px;font-weight:bold;cursor:pointer}
input{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #333;background:#000;color:#fff}
</style>
</head>
<body>
<h1>Qaisypro</h1>
<p>Qaisypro — الوحش</p>

<div class="box">
<h3>⚡ Arena-Clips - GDNA-ARENA</h3>
<p>أخد / لصق / مشاركة - خدام بالوحش</p>
<div style="width:100%;height:10px;background:#222;border-radius:5px;overflow:hidden"><div id="arenaBar" style="height:100%;background:#D4AF37;width:0%"></div></div>
<p id="arenaStatus">جاهز...</p>
<button onclick="arenaGo()">تشغيل Arena-Clips</button>
</div>

<div class="box">
<h3>Upload</h3>
<input type="file" id="fileInput">
<button onclick="upload()">Upload</button>
<p id="status"></p>
</div>

<script>
function arenaGo(){document.getElementById('arenaStatus').textContent='خدام...';let w=0;let t=setInterval(()=>{w+=10;document.getElementById('arenaBar').style.width=w+'%';if(w>=100){clearInterval(t);document.getElementById('arenaStatus').textContent='سالي - Arena-Clips واجد';}},200);}
async function upload(){const f=document.getElementById('fileInput').files[0];if(!f){document.getElementById('status').textContent='ختار ملف';return;}document.getElementById('status').textContent='كيتسيفط...';const fd=new FormData();fd.append('file',f);try{const r=await fetch('/upload',{method:'POST',body:fd});document.getElementById('status').textContent=r.ok?'تم':'خطأ';}catch(e){document.getElementById('status').textContent='خطأ في السيرفر';}}
</script>
</body>
</html>
